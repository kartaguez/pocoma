spring.application.name=pocoma-pipeline-task-executor
spring.flyway.enabled=false
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
pocoma.pipeline.task-execution.enabled=true
pocoma.pipeline.task-execution.worker-id=${POCOMA_PIPELINE_TASK_EXECUTION_WORKER_ID:local}
pocoma.pipeline.task-execution.batch-size=${POCOMA_PIPELINE_TASK_EXECUTION_BATCH_SIZE:100}
pocoma.pipeline.task-execution.polling-interval=${POCOMA_PIPELINE_TASK_EXECUTION_POLLING_INTERVAL:100ms}
pocoma.pipeline.task-execution.lease-duration=${POCOMA_PIPELINE_TASK_EXECUTION_LEASE_DURATION:30s}
pocoma.pipeline.task-execution.thread-count=${POCOMA_PIPELINE_TASK_EXECUTION_THREAD_COUNT:10}
pocoma.pipeline.task-execution.queue-capacity=${POCOMA_PIPELINE_TASK_EXECUTION_QUEUE_CAPACITY:2147483647}
pocoma.pipeline.task-execution.max-retries=${POCOMA_PIPELINE_TASK_EXECUTION_MAX_RETRIES:3}
pocoma.pipeline.task-execution.initial-backoff=${POCOMA_PIPELINE_TASK_EXECUTION_INITIAL_BACKOFF:100ms}
pocoma.pipeline.task-execution.max-backoff=${POCOMA_PIPELINE_TASK_EXECUTION_MAX_BACKOFF:2s}
pocoma.pipeline.task-execution.segment-index=${POCOMA_PIPELINE_TASK_EXECUTION_SEGMENT_INDEX:0}
pocoma.pipeline.task-execution.segment-count=${POCOMA_PIPELINE_TASK_EXECUTION_SEGMENT_COUNT:1}
pocoma.pipeline.task-execution.wake-signals-enabled=${POCOMA_PIPELINE_TASK_EXECUTION_WAKE_SIGNALS_ENABLED:true}
pocoma.pipeline.task-execution.capacity-wakeup-min-interval=${POCOMA_PIPELINE_TASK_EXECUTION_CAPACITY_WAKEUP_MIN_INTERVAL:10ms}
pocoma.pipeline.task-execution.pipelines[0].pipeline-id=balance-projection
pocoma.pipeline.task-execution.pipelines[0].pipeline-version=1
pocoma.pipeline.task-execution.pipelines[0].enabled=true
pocoma.pipeline.task-execution.pipelines[0].task-types[0]=COMPUTE_BALANCES_FOR_VERSION
