spring.application.name=pocoma-runtime-monolith
spring.datasource.url=${POCOMA_POSTGRES_URL:jdbc:postgresql://localhost:5432/pocoma}
spring.datasource.username=${POCOMA_POSTGRES_USER:pocoma}
spring.datasource.password=${POCOMA_POSTGRES_PASSWORD:pocoma}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.lifecycle.timeout-per-shutdown-phase=30s

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true

pocoma.command-admission.enabled=true
pocoma.command-result-read.enabled=true
pocoma.pot-read.enabled=true
pocoma.registration-admission.enabled=true
pocoma.command-admission.authorization-ttl=PT15M
pocoma.command-admission.max-request-bytes=262144
spring.security.oauth2.resourceserver.jwt.audiences=${POCOMA_OIDC_AUDIENCE:pocoma-api}

pocoma.registration-consumption.enabled=true
pocoma.registration-consumption.worker-id=monolith-registration-worker
pocoma.registration-consumption.segment-index=0
pocoma.registration-consumption.segment-count=1
pocoma.registration-result-consumption.enabled=true
pocoma.registration-result-consumption.worker-id=monolith-registration-result-worker
pocoma.registration-result-consumption.segment-index=0
pocoma.registration-result-consumption.segment-count=1
pocoma.binding-consumption.enabled=true
pocoma.binding-consumption.worker-id=monolith-binding-worker
pocoma.binding-consumption.segment-index=0
pocoma.binding-consumption.segment-count=1
pocoma.command-consumption.enabled=true
pocoma.command-consumption.worker-id=monolith-command-worker
pocoma.command-result-consumption.enabled=true
pocoma.command-result-consumption.worker-id=monolith-command-result-worker
pocoma.command-result-consumption.segment-index=0
pocoma.command-result-consumption.segment-count=1
pocoma.event-consumption.enabled=true
pocoma.event-consumption.worker-id=monolith-event-worker
pocoma.event-consumption.segment-index=0
pocoma.event-consumption.segment-count=1
pocoma.event-consumption.projection-types=AUTH,READ_POT,POT_BALANCES
pocoma.projection-task-consumption.enabled=true
pocoma.projection-task-consumption.worker-id=monolith-projection-task-worker
pocoma.projection-task-consumption.segment-index=0
pocoma.projection-task-consumption.segment-count=1
pocoma.projection-task-consumption.catalog-projection-types=AUTH,READ_POT,POT_BALANCES
pocoma.projection-task-consumption.locator-projection-types=AUTH,READ_POT,POT_BALANCES
