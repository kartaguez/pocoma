# Explicit environment, target allowlist, flags and credentials must be supplied externally.
spring.flyway.enabled=false
spring.jpa.open-in-view=false
management.health.db.enabled=false
spring.lifecycle.timeout-per-shutdown-phase=120s
server.address=127.0.0.1
server.port=18080
management.server.address=127.0.0.1
management.server.port=18081
management.endpoints.web.exposure.include=health,prometheus

# READ participants, temporal settings and facade limits are mandatory external inputs.
# This profile alone activates no participant and supplies no database credentials.
