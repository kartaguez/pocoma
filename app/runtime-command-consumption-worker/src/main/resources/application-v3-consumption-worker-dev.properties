# Explicit environment, target allowlist, flags and credentials must be supplied externally.
spring.flyway.enabled=false
spring.jpa.open-in-view=false
management.health.db.enabled=false
spring.lifecycle.timeout-per-shutdown-phase=120s
server.address=127.0.0.1
server.port=18080
management.server.address=127.0.0.1
management.server.port=18081
management.endpoints.web.exposure.include=health,prometheus
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.task.TaskExecutionAutoConfiguration,org.springframework.boot.autoconfigure.task.TaskSchedulingAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,com.kartaguez.pocoma.infra.persistence.read.jdbc.ReadStoreAccessAutoConfiguration,com.kartaguez.pocoma.infra.persistence.read.jdbc.ReadStoreMigrationAutoConfiguration

# Identity I3: external config must select identity-authority=real, identity-request=true,
# fixture-identity=false, command-enabled=false and IdentityRequest limits/partitions.
# No authority or pair is enabled by this profile alone.
