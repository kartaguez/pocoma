spring.application.name=pocoma-task-materialization-dispatcher
spring.flyway.enabled=false
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
pocoma.pipeline.materialization.enabled=true
pocoma.pipeline.materialization.worker-id=${POCOMA_TASK_MATERIALIZATION_WORKER_ID:local}
pocoma.pipeline.materialization.batch-size=${POCOMA_TASK_MATERIALIZATION_BATCH_SIZE:100}
pocoma.pipeline.materialization.polling-interval=${POCOMA_TASK_MATERIALIZATION_POLLING_INTERVAL:250ms}
pocoma.pipeline.materialization.safety-delay=${POCOMA_TASK_MATERIALIZATION_SAFETY_DELAY:0ms}
pocoma.pipeline.materialization.segment-index=${POCOMA_TASK_MATERIALIZATION_SEGMENT_INDEX:0}
pocoma.pipeline.materialization.segment-count=${POCOMA_TASK_MATERIALIZATION_SEGMENT_COUNT:1}
pocoma.pipeline.materialization.wake-signals-enabled=${POCOMA_TASK_MATERIALIZATION_WAKE_SIGNALS_ENABLED:true}
pocoma.task-materialization.nats.enabled=${POCOMA_TASK_MATERIALIZATION_NATS_ENABLED:true}
pocoma.task-materialization.nats.servers=${POCOMA_NATS_SERVERS:nats://localhost:4222}
pocoma.task-materialization.nats.business-events-available-subject=${POCOMA_NATS_BUSINESS_EVENTS_AVAILABLE_SUBJECT:pocoma.projection.business-events.available}
