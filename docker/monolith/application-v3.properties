# Local L7 Monolith configuration. Select the four V3 profiles explicitly.
spring.flyway.enabled=false
spring.jpa.open-in-view=false
management.health.db.enabled=false
management.endpoints.web.exposure.include=health,prometheus,stage-handoffs
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
server.port=8080
server.address=0.0.0.0
management.server.port=18081
management.server.address=0.0.0.0

# HTTP Security / Keycloak OIDC
pocoma.v3.http.issuer=http://localhost:8081/realms/pocoma
pocoma.v3.http.audience=pocoma-api
pocoma.v3.http.jwk-set-uri=http://keycloak:8080/realms/pocoma/protocol/openid-connect/certs

# HTTP Read Facade Pool
pocoma.v3.http.read.url=jdbc:postgresql://postgres:5432/pocoma_read?currentSchema=v3_read
pocoma.v3.http.read.username=pocoma_read_http
pocoma.v3.http.read.password=pocoma-read-http-local-only
pocoma.v3.http.read.maintenance.username=pocoma_read_status
pocoma.v3.http.read.maintenance.password=pocoma-read-status-local-only

# HTTP Admission
pocoma.v3.http.admission.url=jdbc:postgresql://postgres:5432/pocoma_write?currentSchema=v3_write
pocoma.v3.http.admission.username=pocoma_admission
pocoma.v3.http.admission.password=pocoma-local-only
pocoma.v3.http.admission.database=pocoma_write
pocoma.v3.http.admission.schema=v3_write
pocoma.v3.http.admission.lookup-key-id=stable
pocoma.v3.http.admission.lookup-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
pocoma.v3.http.admission.comparison-current=k1
pocoma.v3.http.admission.comparison-key-ids=k1
pocoma.v3.http.admission.comparison-keys.k1=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# Physical authority names for pool validation.
pocoma.v3.pilot.write.database=pocoma_write
pocoma.v3.pilot.write.schema=v3_write
pocoma.v3.pilot.write.username=pocoma_write
pocoma.v3.pilot.read.database=pocoma_read
pocoma.v3.pilot.read.schema=v3_read
pocoma.v3.pilot.read.username=pocoma_read

# Process owns its own capacity and transaction resources.
pocoma.v3.process.enabled=true
pocoma.v3.process.environment=DEV
pocoma.v3.process.fixture-identity=false
pocoma.v3.process.identity-authority=real
pocoma.v3.process.technical-probes=false
pocoma.v3.process.min-poll=2
pocoma.v3.process.max-poll=20
pocoma.v3.process.error-poll=50
pocoma.v3.process.quantum=4
pocoma.v3.process.lifecycle.batch-size=32
pocoma.v3.process.lifecycle.claim-duration-ms=60000
pocoma.v3.process.lifecycle.lease-duration-ms=240000
pocoma.v3.process.worker-name=monolith-process
pocoma.v3.process.worker-limit=4
pocoma.v3.process.identity-request=true
pocoma.v3.process.command-enabled=true
pocoma.v3.process.consumption-limits=Command=4,IdentityRequest=2
pocoma.v3.process.partitions=Command=0|1|2|3;IdentityRequest=0|1|2|3
pocoma.v3.process.dev-targets=postgres,5432,pocoma_write,v3_write,pocoma_write,172.28.0.2/32,5432
pocoma.v3.process.source-read-role=pocoma_write_source_read
pocoma.v3.process.write-business.url=jdbc:postgresql://postgres:5432/pocoma_write?currentSchema=v3_write
pocoma.v3.process.write-business.username=pocoma_write
pocoma.v3.process.write-business.password=pocoma-local-only
pocoma.v3.process.write-control.url=jdbc:postgresql://postgres:5432/pocoma_write?currentSchema=v3_write
pocoma.v3.process.write-control.username=pocoma_write
pocoma.v3.process.write-control.password=pocoma-local-only

# Materialize owns its own capacity and transaction resources.
pocoma.v3.materialize.enabled=true
pocoma.v3.materialize.environment=DEV
pocoma.v3.materialize.fixture-identity=false
pocoma.v3.materialize.identity-authority=real
pocoma.v3.materialize.technical-probes=false
pocoma.v3.materialize.min-poll=2
pocoma.v3.materialize.max-poll=20
pocoma.v3.materialize.error-poll=50
pocoma.v3.materialize.quantum=4
pocoma.v3.materialize.lifecycle.batch-size=32
pocoma.v3.materialize.lifecycle.claim-duration-ms=60000
pocoma.v3.materialize.lifecycle.lease-duration-ms=240000
pocoma.v3.materialize.worker-name=monolith-materialize
pocoma.v3.materialize.worker-limit=4
pocoma.v3.materialize.identity-request=false
pocoma.v3.materialize.command-enabled=false
pocoma.v3.materialize.consumption-limits=MaterializePotVersion=2,MaterializePotBalance=2,MaterializePotVisibility=2,MaterializeCurrentBinding=2,MaterializeCommandResult=4,MaterializeIdentityRequestResult=2
pocoma.v3.materialize.partitions=MaterializePotVersion=0|1|2|3;MaterializePotBalance=0|1|2|3;MaterializePotVisibility=0|1|2|3;MaterializeCurrentBinding=0|1|2|3;MaterializeCommandResult=0|1|2|3;MaterializeIdentityRequestResult=0|1|2|3
pocoma.v3.materialize.read-participants=MaterializePotVersion,MaterializePotBalance,MaterializePotVisibility,MaterializeCurrentBinding,MaterializeCommandResult,MaterializeIdentityRequestResult
pocoma.v3.materialize.dev-targets=postgres,5432,pocoma_write,v3_write,pocoma_write_source_read,172.28.0.2/32,5432;postgres,5432,pocoma_read,v3_read,pocoma_read,172.28.0.2/32,5432
pocoma.v3.materialize.write-source-read.url=jdbc:postgresql://postgres:5432/pocoma_write?currentSchema=v3_write
pocoma.v3.materialize.write-source-read.username=pocoma_write_source_read
pocoma.v3.materialize.write-source-read.password=pocoma-source-local-only
pocoma.v3.materialize.read-business.url=jdbc:postgresql://postgres:5432/pocoma_read?currentSchema=v3_read
pocoma.v3.materialize.read-business.username=pocoma_read
pocoma.v3.materialize.read-business.password=pocoma-local-only
pocoma.v3.materialize.read-control.url=jdbc:postgresql://postgres:5432/pocoma_read?currentSchema=v3_read
pocoma.v3.materialize.read-control.username=pocoma_read
pocoma.v3.materialize.read-control.password=pocoma-local-only
