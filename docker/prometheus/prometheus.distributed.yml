global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: pocoma-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["pocoma-api:8080"]

  - job_name: pocoma-command-consumption-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["pocoma-command-consumption-worker:8080"]

  - job_name: pocoma-command-result-consumption-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["pocoma-command-result-consumption-worker:8080"]

  - job_name: pocoma-latest-known-version-consumption-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["pocoma-latest-known-version-consumption-worker:8080"]

  - job_name: pocoma-event-consumption-workers
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - pocoma-event-consumption-worker-0:8080
          - pocoma-event-consumption-worker-1:8080

  - job_name: pocoma-task-consumption-workers
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - pocoma-task-consumption-worker-0:8080
          - pocoma-task-consumption-worker-1:8080
