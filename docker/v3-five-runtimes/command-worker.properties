# Pocoma V3 Command & Identity Worker Configuration (L7/I1)
spring.flyway.enabled=false
spring.jpa.open-in-view=false
management.health.db.enabled=false
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
server.port=0
management.server.port=18083
management.server.address=0.0.0.0

# Worker Polling & Latency (Permanent reconciliation + DEGRADED fallback)
pocoma.v3.worker.min-poll=2
pocoma.v3.worker.max-poll=20
pocoma.v3.worker.error-poll=50

# Core NATS Event-Driven Wakeup (T1A target default)
pocoma.v3.wakeup.mode=nats
pocoma.v3.wakeup.url=nats://nats:4222
pocoma.v3.wakeup.auth-token=pocoma-nats-local-only
pocoma.v3.wakeup.coalesce-strategy=IN_FLIGHT_DEDUP
pocoma.v3.wakeup.coalesce-window-ms=1
pocoma.v3.wakeup.reconcile-poll-ms=2000
pocoma.v3.wakeup.fallback-max-poll-ms=20
pocoma.v3.wakeup.consumption-max-poll-ms=500
pocoma.v3.wakeup.connection-timeout-ms=2000
pocoma.v3.wakeup.reconnect-wait-ms=250
pocoma.v3.wakeup.ping-interval-ms=2000
pocoma.v3.wakeup.max-pings-out=2
pocoma.v3.wakeup.connect-retry-delay-ms=500
pocoma.v3.wakeup.reconnect-buffer-bytes=65536

# Worker Settings — Command & Identity Worker
pocoma.v3.worker.enabled=true
pocoma.v3.worker.quantum=4
pocoma.v3.worker.environment=DEV
pocoma.v3.worker.fixture-identity=false
pocoma.v3.worker.identity-authority=real
pocoma.v3.worker.identity-request=true
pocoma.v3.worker.command-enabled=true
pocoma.v3.worker.technical-probes=false
pocoma.v3.worker.worker-name=command-worker
pocoma.v3.worker.worker-limit=4
pocoma.v3.worker.consumption-limits=Command=3,IdentityRequest=2
pocoma.v3.worker.partitions=Command=0|1|2|3;IdentityRequest=0|1|2|3
pocoma.v3.worker.lifecycle.batch-size=32
pocoma.v3.worker.lifecycle.claim-duration-ms=60000
pocoma.v3.worker.lifecycle.lease-duration-ms=30000

# Pilot Database Credentials
pocoma.v3.worker.dev-targets=postgres,5432,pocoma_write,v3_write,pocoma_write,172.28.0.2/32,5432
pocoma.v3.pilot.write.database=pocoma_write
pocoma.v3.pilot.write.schema=v3_write
pocoma.v3.pilot.write.username=pocoma_write
pocoma.v3.pilot.write.password=pocoma-local-only
pocoma.v3.pilot.write.url=jdbc:postgresql://postgres:5432/pocoma_write?currentSchema=v3_write

# Worker Pools (Configurable bounded sizing)
pocoma.v3.worker.write-business.url=jdbc:postgresql://postgres:5432/pocoma_write?currentSchema=v3_write
pocoma.v3.worker.write-business.username=pocoma_write
pocoma.v3.worker.write-business.password=pocoma-local-only
pocoma.v3.worker.write-business.minimum-idle=6
pocoma.v3.worker.write-business.maximum-pool-size=6

pocoma.v3.worker.write-control.url=jdbc:postgresql://postgres:5432/pocoma_write?currentSchema=v3_write
pocoma.v3.worker.write-control.username=pocoma_write
pocoma.v3.worker.write-control.password=pocoma-local-only
pocoma.v3.worker.write-control.minimum-idle=10
pocoma.v3.worker.write-control.maximum-pool-size=10

pocoma.v3.process.source-read-role=pocoma_write_source_read
