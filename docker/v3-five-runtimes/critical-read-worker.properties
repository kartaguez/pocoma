# Pocoma V3 Critical READ Worker Configuration (T1A + Core NATS)
# Hosts critical low-latency projections: CommandResult + IdentityRequestResult + CurrentBinding.
spring.main.web-application-type=servlet
spring.flyway.enabled=false
spring.jpa.open-in-view=false
management.health.db.enabled=false
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
server.port=0
management.server.port=18084
management.server.address=0.0.0.0

# Worker Polling & Latency (Permanent reconciliation + DEGRADED fallback)
pocoma.v3.worker.min-poll=2
pocoma.v3.worker.max-poll=20
pocoma.v3.worker.error-poll=50

# Core NATS Event-Driven Wakeup (T1A target default)
pocoma.v3.wakeup.mode=nats
pocoma.v3.wakeup.url=nats://nats:4222
pocoma.v3.wakeup.auth-token=pocoma-nats-local-only
pocoma.v3.wakeup.reconcile-poll-ms=2000
pocoma.v3.wakeup.fallback-max-poll-ms=20
pocoma.v3.wakeup.consumption-max-poll-ms=500
pocoma.v3.wakeup.connection-timeout-ms=2000
pocoma.v3.wakeup.reconnect-wait-ms=250
pocoma.v3.wakeup.ping-interval-ms=2000
pocoma.v3.wakeup.max-pings-out=2
pocoma.v3.wakeup.connect-retry-delay-ms=500
pocoma.v3.wakeup.reconnect-buffer-bytes=65536

# Worker Settings — Critical READ Worker (T1A)
pocoma.v3.worker.enabled=true
pocoma.v3.worker.quantum=4
pocoma.v3.worker.environment=DEV
pocoma.v3.worker.fixture-identity=false
pocoma.v3.worker.identity-authority=real
pocoma.v3.worker.identity-request=false
pocoma.v3.worker.command-enabled=false
pocoma.v3.worker.technical-probes=false
pocoma.v3.worker.worker-name=critical-read-worker
pocoma.v3.worker.worker-limit=4
pocoma.v3.worker.read-participants=MaterializeCommandResult,MaterializeIdentityRequestResult,MaterializeCurrentBinding
pocoma.v3.worker.consumption-limits=MaterializeCommandResult=2,MaterializeIdentityRequestResult=2,MaterializeCurrentBinding=2
pocoma.v3.worker.partitions=MaterializeCommandResult=0|1|2|3;MaterializeIdentityRequestResult=0|1|2|3;MaterializeCurrentBinding=0|1|2|3
pocoma.v3.worker.lifecycle.batch-size=32
pocoma.v3.worker.lifecycle.claim-duration-ms=60000
pocoma.v3.worker.lifecycle.lease-duration-ms=30000

# Pilot Database Credentials
pocoma.v3.worker.dev-targets=postgres,5432,pocoma_write,v3_write,pocoma_write_source_read,172.28.0.2/32,5432;postgres,5432,pocoma_read,v3_read,pocoma_read,172.28.0.2/32,5432
pocoma.v3.pilot.write.database=pocoma_write
pocoma.v3.pilot.write.schema=v3_write
pocoma.v3.pilot.read.database=pocoma_read
pocoma.v3.pilot.read.schema=v3_read
pocoma.v3.pilot.read.username=pocoma_read
pocoma.v3.pilot.read.password=pocoma-local-only
pocoma.v3.pilot.read.url=jdbc:postgresql://postgres:5432/pocoma_read?currentSchema=v3_read

# Worker Pools (Configurable bounded sizing)
pocoma.v3.worker.write-source-read.url=jdbc:postgresql://postgres:5432/pocoma_write?currentSchema=v3_write
pocoma.v3.worker.write-source-read.username=pocoma_write_source_read
pocoma.v3.worker.write-source-read.password=pocoma-source-local-only
pocoma.v3.worker.write-source-read.minimum-idle=6
pocoma.v3.worker.write-source-read.maximum-pool-size=6

pocoma.v3.worker.read-business.url=jdbc:postgresql://postgres:5432/pocoma_read?currentSchema=v3_read
pocoma.v3.worker.read-business.username=pocoma_read
pocoma.v3.worker.read-business.password=pocoma-local-only
pocoma.v3.worker.read-business.minimum-idle=6
pocoma.v3.worker.read-business.maximum-pool-size=6

pocoma.v3.worker.read-control.url=jdbc:postgresql://postgres:5432/pocoma_read?currentSchema=v3_read
pocoma.v3.worker.read-control.username=pocoma_read
pocoma.v3.worker.read-control.password=pocoma-local-only
pocoma.v3.worker.read-control.minimum-idle=10
pocoma.v3.worker.read-control.maximum-pool-size=10
