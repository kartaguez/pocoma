global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: pocoma-http-write
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["pocoma-http-write:18080"]

  - job_name: pocoma-command-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["pocoma-command-worker:18083"]

  - job_name: pocoma-results-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["pocoma-results-worker:18084"]

  - job_name: pocoma-business-read-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["pocoma-business-read-worker:18085"]

  - job_name: pocoma-http-read
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["pocoma-http-read:18082"]
