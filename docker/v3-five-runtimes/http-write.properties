# Pocoma V3 HTTP WRITE Runtime Configuration (L7/I1)
spring.flyway.enabled=false
spring.jpa.open-in-view=false
management.health.db.enabled=false
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
server.port=8080
server.address=0.0.0.0
management.server.port=18080
management.server.address=0.0.0.0

# HTTP Security / Keycloak OIDC
pocoma.v3.http.issuer=http://localhost:8081/realms/pocoma
pocoma.v3.http.audience=pocoma-api
pocoma.v3.http.jwk-set-uri=http://keycloak:8080/realms/pocoma/protocol/openid-connect/certs

# HTTP Admission
pocoma.v3.http.admission.url=jdbc:postgresql://postgres:5432/pocoma_write?currentSchema=v3_write
pocoma.v3.http.admission.username=pocoma_admission
pocoma.v3.http.admission.password=pocoma-local-only
pocoma.v3.http.admission.database=pocoma_write
pocoma.v3.http.admission.schema=v3_write
pocoma.v3.http.admission.lookup-key-id=stable
pocoma.v3.http.admission.lookup-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
pocoma.v3.http.admission.comparison-current=k1
pocoma.v3.http.admission.comparison-key-ids=k1
pocoma.v3.http.admission.comparison-keys.k1=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
# Capacité effective d'admission HTTP WRITE (sémaphore AdmissionTransport + pool Hikari v3-http-admission).
# Les anciennes clés pocoma.v3.http.admission.maximum / minimum-idle ne sont pas lues par AdmissionHttpConfiguration.
pocoma.v3.http.admission.capacity=4

# Core NATS Event-Driven Wakeup Publisher (post-COMMIT volatile hints only)
pocoma.v3.wakeup.mode=nats
pocoma.v3.wakeup.url=nats://nats:4222
pocoma.v3.wakeup.auth-token=pocoma-nats-local-only
pocoma.v3.wakeup.coalesce-strategy=IN_FLIGHT_DEDUP
pocoma.v3.wakeup.coalesce-window-ms=1
pocoma.v3.wakeup.connection-timeout-ms=2000
pocoma.v3.wakeup.reconnect-wait-ms=250
pocoma.v3.wakeup.ping-interval-ms=2000
pocoma.v3.wakeup.max-pings-out=2
pocoma.v3.wakeup.connect-retry-delay-ms=500
pocoma.v3.wakeup.reconnect-buffer-bytes=65536
