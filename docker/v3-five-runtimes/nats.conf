# Pocoma V3 — Core NATS Wakeup Broker Configuration (T1A + Core NATS)
# Ephemeral volatile wakeup hints only: NO JetStream, NO persistence, NO business payload.

port: 4222
http_port: 8222

# Strictly disable JetStream and disk persistence.
jetstream: false

# Bounded resource limits for local distribution (internal network only).
max_connections: 64
max_payload: 1024
max_pending: 4MB
ping_interval: "15s"
ping_max: 3
write_deadline: "2s"

# Local technical authentication token (overridden per-instance by pocoma-local).
authorization {
  token: "pocoma-nats-local-only"
}
