name: pocoma-monolith-postgres

x-pocoma-monolith-build: &pocoma-monolith-build
  context: ./app
  dockerfile: Dockerfile
  args:
    RUNTIME_MODULE: runtime-monolith
    RUNTIME_ARTIFACT: pocoma-runtime-monolith

services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pocoma}
      POSTGRES_USER: ${POSTGRES_USER:-pocoma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pocoma}
    volumes:
      - pocoma-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pocoma} -d ${POSTGRES_DB:-pocoma}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  pocoma-monolith:
    build:
      <<: *pocoma-monolith-build
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      POCOMA_POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pocoma}
      POCOMA_POSTGRES_USER: ${POSTGRES_USER:-pocoma}
      POCOMA_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pocoma}
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.monolith.yml:/etc/prometheus/prometheus.yml:ro
      - pocoma-prometheus-data:/prometheus
    depends_on:
      pocoma-monolith:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - pocoma-grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  pocoma-postgres-data:
  pocoma-prometheus-data:
  pocoma-grafana-data:
