name: pocoma-distributed

x-pocoma-java-build: &pocoma-java-build
  context: ./app
  dockerfile: Dockerfile

x-pocoma-java-environment: &pocoma-java-environment
  SPRING_PROFILES_ACTIVE: postgres
  POCOMA_POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pocoma}
  POCOMA_POSTGRES_USER: ${POSTGRES_USER:-pocoma}
  POCOMA_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pocoma}

services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pocoma}
      POSTGRES_USER: ${POSTGRES_USER:-pocoma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pocoma}
    volumes:
      - pocoma-postgres-data:/var/lib/postgresql/data
    networks:
      pocoma-distributed:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pocoma} -d ${POSTGRES_DB:-pocoma}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  pocoma-api:
    build:
      <<: *pocoma-java-build
      args:
        RUNTIME_MODULE: runtime-web-api
        RUNTIME_ARTIFACT: pocoma-runtime-web-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      <<: *pocoma-java-environment
      POCOMA_QUERY_BALANCE_PIPELINE_ID: balance-projection
      POCOMA_QUERY_BALANCE_PIPELINE_VERSION: ${POCOMA_BALANCE_PIPELINE_VERSION:?POCOMA_BALANCE_PIPELINE_VERSION is required}
    networks:
      - pocoma-distributed
    depends_on:
      postgres:
        condition: service_healthy

  pocoma-event-consumption-worker-0:
    build:
      <<: *pocoma-java-build
      args:
        RUNTIME_MODULE: runtime-event-consumption-worker
        RUNTIME_ARTIFACT: pocoma-runtime-event-consumption-worker
    expose:
      - "8080"
    environment:
      <<: *pocoma-java-environment
      POCOMA_EVENT_CONSUMPTION_ENABLED: "true"
      POCOMA_EVENT_CONSUMPTION_PIPELINE_ID: balance-projection
      POCOMA_EVENT_CONSUMPTION_PIPELINE_VERSION: ${POCOMA_BALANCE_PIPELINE_VERSION:?POCOMA_BALANCE_PIPELINE_VERSION is required}
      POCOMA_EVENT_CONSUMPTION_SEGMENT_INDEX: 0
      POCOMA_EVENT_CONSUMPTION_SEGMENT_COUNT: ${POCOMA_SEGMENT_COUNT:-2}
    networks:
      - pocoma-distributed
    depends_on:
      postgres:
        condition: service_healthy

  pocoma-event-consumption-worker-1:
    build:
      <<: *pocoma-java-build
      args:
        RUNTIME_MODULE: runtime-event-consumption-worker
        RUNTIME_ARTIFACT: pocoma-runtime-event-consumption-worker
    expose:
      - "8080"
    environment:
      <<: *pocoma-java-environment
      POCOMA_EVENT_CONSUMPTION_ENABLED: "true"
      POCOMA_EVENT_CONSUMPTION_PIPELINE_ID: balance-projection
      POCOMA_EVENT_CONSUMPTION_PIPELINE_VERSION: ${POCOMA_BALANCE_PIPELINE_VERSION:?POCOMA_BALANCE_PIPELINE_VERSION is required}
      POCOMA_EVENT_CONSUMPTION_SEGMENT_INDEX: 1
      POCOMA_EVENT_CONSUMPTION_SEGMENT_COUNT: ${POCOMA_SEGMENT_COUNT:-2}
    networks:
      - pocoma-distributed
    depends_on:
      postgres:
        condition: service_healthy

  pocoma-task-consumption-worker-0:
    build:
      <<: *pocoma-java-build
      args:
        RUNTIME_MODULE: runtime-task-consumption-worker
        RUNTIME_ARTIFACT: pocoma-runtime-task-consumption-worker
    expose:
      - "8080"
    environment:
      <<: *pocoma-java-environment
      POCOMA_TASK_CONSUMPTION_ENABLED: "true"
      POCOMA_TASK_CONSUMPTION_PIPELINE_ID: balance-projection
      POCOMA_TASK_CONSUMPTION_PIPELINE_VERSION: ${POCOMA_BALANCE_PIPELINE_VERSION:?POCOMA_BALANCE_PIPELINE_VERSION is required}
      POCOMA_TASK_CONSUMPTION_SEGMENT_INDEX: 0
      POCOMA_TASK_CONSUMPTION_SEGMENT_COUNT: ${POCOMA_SEGMENT_COUNT:-2}
    networks:
      - pocoma-distributed
    depends_on:
      postgres:
        condition: service_healthy

  pocoma-task-consumption-worker-1:
    build:
      <<: *pocoma-java-build
      args:
        RUNTIME_MODULE: runtime-task-consumption-worker
        RUNTIME_ARTIFACT: pocoma-runtime-task-consumption-worker
    expose:
      - "8080"
    environment:
      <<: *pocoma-java-environment
      POCOMA_TASK_CONSUMPTION_ENABLED: "true"
      POCOMA_TASK_CONSUMPTION_PIPELINE_ID: balance-projection
      POCOMA_TASK_CONSUMPTION_PIPELINE_VERSION: ${POCOMA_BALANCE_PIPELINE_VERSION:?POCOMA_BALANCE_PIPELINE_VERSION is required}
      POCOMA_TASK_CONSUMPTION_SEGMENT_INDEX: 1
      POCOMA_TASK_CONSUMPTION_SEGMENT_COUNT: ${POCOMA_SEGMENT_COUNT:-2}
    networks:
      - pocoma-distributed
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.distributed.yml:/etc/prometheus/prometheus.yml:ro
      - pocoma-prometheus-data:/prometheus
    networks:
      - pocoma-distributed
    depends_on:
      pocoma-api:
        condition: service_started
      pocoma-event-consumption-worker-0:
        condition: service_started
      pocoma-event-consumption-worker-1:
        condition: service_started
      pocoma-task-consumption-worker-0:
        condition: service_started
      pocoma-task-consumption-worker-1:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - pocoma-grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - pocoma-distributed
    depends_on:
      prometheus:
        condition: service_started

networks:
  pocoma-distributed:
    name: pocoma-distributed-net

volumes:
  pocoma-postgres-data:
  pocoma-prometheus-data:
  pocoma-grafana-data:
