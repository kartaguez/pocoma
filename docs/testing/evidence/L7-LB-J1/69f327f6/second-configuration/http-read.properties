# Pocoma V3 HTTP READ Runtime Configuration (L7/I1)
spring.flyway.enabled=false
spring.jpa.open-in-view=false
management.health.db.enabled=false
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
server.port=8082
server.address=0.0.0.0
management.server.port=18082
management.server.address=0.0.0.0

# HTTP Security / Keycloak OIDC
pocoma.v3.http.issuer=http://localhost:57563/realms/pocoma
pocoma.v3.http.audience=pocoma-api
pocoma.v3.http.jwk-set-uri=http://keycloak:8080/realms/pocoma/protocol/openid-connect/certs

# HTTP Read Facade Pool
pocoma.v3.http.read.url=jdbc:postgresql://postgres:5432/pocoma_read?currentSchema=v3_read
pocoma.v3.http.read.username=pocoma_read_http
pocoma.v3.http.read.password=[REDACTED]

# Read Limits
pocoma.v3.worker.read-limits.expense-batch=50
pocoma.v3.worker.read-limits.navigation-page=100
pocoma.v3.worker.read-limits.response-budget=16000000
pocoma.v3.http.read.maintenance.username=pocoma_read_status
pocoma.v3.http.read.maintenance.password=[REDACTED]

pocoma.v3.invitation.current-key=local
pocoma.v3.invitation.key-ids=local
pocoma.v3.invitation.keys.local=[REDACTED]
